{
  "name": "crm",
  "services": {
    "crm": {
      "image": "crm-app:recovered-20260921",
      "env_file": [
        {
          "path": ".env.docker-crm",
          "format": "raw"
        }
      ],
      "restart": "unless-stopped",
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile"
      },
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/system/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
        ],
        "interval": "10000000000ns",
        "timeout": "5000000000ns",
        "start_period": "20000000000ns",
        "retries": 6
      },
      "ports": [
        "127.0.0.1:3000:3000/tcp"
      ],
      "volumes": [
        {
          "type": "volume",
          "source": "crm_crm_document_storage",
          "target": "/app/storage",
          "read_only": false
        }
      ],
      "networks": [
        "crm_default"
      ],
      "depends_on": {
        "database": {
          "condition": "service_healthy"
        }
      }
    },
    "reminder-worker": {
      "image": "crm-app:recovered-20260921",
      "env_file": [
        {
          "path": ".env.docker-reminder-worker",
          "format": "raw"
        }
      ],
      "restart": "unless-stopped",
      "entrypoint": [
        "node",
        "scripts/reminder-worker.mjs"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "scripts/reminder-worker.mjs",
          "--healthcheck"
        ],
        "interval": "30000000000ns",
        "timeout": "10000000000ns",
        "start_period": "20000000000ns",
        "retries": 4
      },
      "networks": [
        "crm_default"
      ],
      "depends_on": {
        "crm": {
          "condition": "service_healthy"
        }
      }
    },
    "backup-worker": {
      "image": "crm-app:recovered-20260921",
      "env_file": [
        {
          "path": ".env.docker-backup-worker",
          "format": "raw"
        }
      ],
      "restart": "unless-stopped",
      "entrypoint": [
        "node",
        "scripts/backup-worker.mjs"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "scripts/backup-worker.mjs",
          "--healthcheck"
        ],
        "interval": "30000000000ns",
        "timeout": "10000000000ns",
        "start_period": "90000000000ns",
        "retries": 6
      },
      "volumes": [
        {
          "type": "bind",
          "source": "./backups",
          "target": "/app/backup-export",
          "read_only": false
        },
        {
          "type": "volume",
          "source": "crm_crm_backups",
          "target": "/app/backups",
          "read_only": false
        },
        {
          "type": "volume",
          "source": "crm_crm_document_storage",
          "target": "/app/storage",
          "read_only": true
        }
      ],
      "networks": [
        "crm_default"
      ],
      "depends_on": {
        "crm": {
          "condition": "service_healthy"
        }
      }
    },
    "database": {
      "image": "postgres:17-alpine",
      "env_file": [
        {
          "path": ".env.docker-database",
          "format": "raw"
        }
      ],
      "restart": "unless-stopped",
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""
        ],
        "interval": "5000000000ns",
        "timeout": "3000000000ns",
        "retries": 10
      },
      "ports": [
        "127.0.0.1:54329:5432/tcp"
      ],
      "volumes": [
        {
          "type": "volume",
          "source": "crm_crm_postgres_data",
          "target": "/var/lib/postgresql/data",
          "read_only": false
        }
      ],
      "networks": [
        "crm_default"
      ]
    }
  },
  "volumes": {
    "crm_crm_document_storage": {
      "external": true,
      "name": "crm_crm_document_storage"
    },
    "crm_crm_backups": {
      "external": true,
      "name": "crm_crm_backups"
    },
    "crm_crm_postgres_data": {
      "external": true,
      "name": "crm_crm_postgres_data"
    }
  },
  "networks": {
    "crm_default": {
      "external": true,
      "name": "crm_default"
    }
  }
}
